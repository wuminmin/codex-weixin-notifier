services:
  catm:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:61937:61937"
    volumes:
      - catm-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:61937/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  catm-data:
